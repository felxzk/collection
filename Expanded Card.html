<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanded Card — fel's collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === Reset === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { line-height: 1; }

        /* === Tokens === */
        :root {
            --font: 'Inter', sans-serif;
            --color-text: #ffffff;
            --color-muted: rgba(255,255,255,0.5);
            --color-accent: #7c3aed;
            --color-accent-hover: #6d28d9;
            --color-danger: #ef4444;
            --color-card-bg: hsla(0,0%,100%,0.1);
            --radius-sm: 0.15rem;
            --radius-md: 0.5rem;
            --transition: 150ms ease;
        }

        /* === Background === */
        body {
            min-height: 100dvh;
            font-family: var(--font);
            color: var(--color-text);
            background-color: #000;
        }
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background-image:
                radial-gradient(at 85% 6%, hsla(260,100%,27%,1) 0px, transparent 50%),
                radial-gradient(at 22% 72%, hsla(266,100%,17%,1) 0px, transparent 50%);
        }

        /* === Header === */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 2.5rem;
            margin-bottom: 2.5rem;
        }
        .site-identity { display: flex; flex-direction: column; gap: .2rem; }
        #site-title {
            font-size: clamp(1.4rem, 3dvw, 2.2rem);
            font-weight: 800;
            letter-spacing: -.03em;
            background: linear-gradient(120deg, #fff 20%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .site-identity small { font-size: .75rem; color: var(--color-muted); }

        /* === Filter bar === */
        .filter-bar {
            display: flex;
            justify-content: center;
            padding: 0 2.5rem 1.25rem;
            margin-top: calc(-2.5rem + .75rem);
        }
        .btn-category {
            all: unset;
            cursor: pointer;
            padding: .35rem .9rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: .8rem;
            color: var(--color-muted);
        }

        /* === Grid === */
        .item-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            padding: 0 2.5rem 4rem;
        }

        /* === Card === */
        .card {
            width: clamp(9rem, 20dvw, 18rem);
            height: clamp(9rem, 20dvw, 18rem);
            background: var(--color-card-bg);
            border-radius: var(--radius-md);
            padding: 1rem .75rem .5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.07);
            transition: background var(--transition), border-color var(--transition), transform 200ms ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            background: hsla(0,0%,100%,0.13);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .card:active { transform: scale(.98); }
        .card.opening { animation: cardPop 180ms ease forwards; }
        @keyframes cardPop {
            0%   { transform: scale(1); }
            50%  { transform: scale(.96); }
            100% { transform: scale(1); }
        }
        .card h2 { font-size: .95rem; font-weight: 800; text-align: center; }
        .card .logo { width: clamp(2rem,5dvw,4.5rem); height: auto; object-fit: contain; }
        .card .tag {
            background: var(--color-danger);
            color: #fff;
            padding: .2rem .4rem;
            border-radius: var(--radius-sm);
            font-size: .65rem;
            font-weight: 600;
        }
        .card-tags { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin-top: auto; }
        .card-desc {
            font-size: .75rem;
            color: var(--color-muted);
            text-align: center;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        /* === Backdrop === */
        .backdrop {
            position: fixed; inset: 0; z-index: 300;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 220ms ease;
            padding: 1rem;
        }
        .backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        /* === Expanded card === */
        .expanded-card {
            position: relative;
            width: min(520px, 100%);
            background: hsl(258,25%,8%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transform: scale(.94) translateY(8px);
            transition: transform 240ms cubic-bezier(.16,1,.3,1);
            box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(124,58,237,0.15);
            overflow: hidden;
        }
        .backdrop.open .expanded-card {
            transform: scale(1) translateY(0);
        }

        /* glow behind logo */
        .expanded-card::before {
            content: '';
            position: absolute;
            top: -40px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        /* close */
        .btn-close {
            all: unset;
            position: absolute;
            top: 1rem; right: 1rem;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            cursor: pointer;
            color: var(--color-muted);
            font-size: 1rem;
            transition: background var(--transition), color var(--transition);
            line-height: 1;
        }
        .btn-close:hover { background: rgba(255,255,255,0.13); color: #fff; }

        /* expanded header row */
        .expanded-header {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .expanded-logo-wrap {
            flex-shrink: 0;
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.06);
            border-radius: .75rem;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .expanded-logo-wrap img { width: 40px; height: 40px; object-fit: contain; }
        .expanded-title-block { display: flex; flex-direction: column; gap: .35rem; }
        .expanded-name { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
        .expanded-category { font-size: .75rem; color: var(--color-muted); }

        /* divider */
        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); }

        /* description */
        .expanded-desc {
            font-size: .875rem;
            color: rgba(255,255,255,0.75);
            line-height: 1.65;
        }

        /* tags row */
        .expanded-tags { display: flex; flex-wrap: wrap; gap: .5rem; }
        .expanded-tags .tag {
            background: rgba(239,68,68,0.18);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
            padding: .3rem .6rem;
            border-radius: var(--radius-sm);
            font-size: .75rem;
            font-weight: 600;
        }

        /* meta row */
        .expanded-meta {
            display: flex;
            gap: 1.5rem;
        }
        .meta-item { display: flex; flex-direction: column; gap: .3rem; }
        .meta-label { font-size: .7rem; color: var(--color-muted); text-transform: uppercase; letter-spacing: .06em; }
        .meta-value { font-size: .825rem; font-weight: 600; }

        /* actions */
        .expanded-actions { display: flex; gap: .75rem; margin-top: .25rem; }
        .btn-primary {
            all: unset;
            cursor: pointer;
            background: var(--color-accent);
            padding: .6rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: .875rem;
            font-weight: 700;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
            flex: 1;
            text-align: center;
        }
        .btn-primary:hover {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(124,58,237,0.45);
        }
        .btn-secondary {
            all: unset;
            cursor: pointer;
            padding: .6rem 1.1rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.15);
            font-size: .875rem;
            color: var(--color-muted);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
            text-align: center;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.07);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .btn-secondary.copied {
            color: #86efac;
            border-color: rgba(134,239,172,0.4);
        }

        /* === Tweaks panel === */
        .tweaks-panel {
            position: fixed;
            bottom: 1.25rem; right: 1.25rem;
            z-index: 500;
            background: hsl(258,25%,8%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: .75rem;
            padding: 1rem 1.1rem;
            width: 220px;
            display: none;
            flex-direction: column;
            gap: .75rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6);
            font-size: .8rem;
        }
        .tweaks-panel.open { display: flex; }
        .tweaks-title {
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--color-muted);
        }
        .tweak-row { display: flex; flex-direction: column; gap: .3rem; }
        .tweak-label { font-size: .72rem; color: var(--color-muted); }
        .tweak-options { display: flex; gap: .35rem; }
        .tweak-opt {
            all: unset;
            cursor: pointer;
            padding: .3rem .6rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: .72rem;
            color: var(--color-muted);
            transition: all var(--transition);
        }
        .tweak-opt:hover { background: rgba(255,255,255,0.07); color: #fff; }
        .tweak-opt.active {
            background: rgba(124,58,237,0.3);
            border-color: rgba(124,58,237,0.6);
            color: #fff;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="site-identity">
        <span id="site-title">fel's collection</span>
        <small>made it out the bookmarks bar</small>
    </div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);width:360px;">
        <div style="position:relative;">
            <span style="position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5);font-size:1.1rem;pointer-events:none;">⌕</span>
            <input type="text" placeholder="search..." style="all:unset;display:block;width:100%;box-sizing:border-box;padding:.45rem .75rem .45rem 2rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:2rem;color:#fff;font-size:.875rem;font-family:inherit;">
        </div>
    </div>
    <button style="all:unset;cursor:pointer;background:#7c3aed;padding:.45rem 1.1rem;border-radius:.5rem;font-weight:700;font-size:.875rem;font-family:inherit;">log in</button>
</header>

<div class="filter-bar">
    <button class="btn-category">all categories</button>
</div>

<section class="item-wrapper" id="grid"></section>

<!-- Backdrop + Expanded Card -->
<div class="backdrop" id="backdrop" role="dialog" aria-modal="true">
    <div class="expanded-card" id="expanded-card">
        <button class="btn-close" id="btn-close" aria-label="Close">✕</button>

        <div class="expanded-header">
            <div class="expanded-logo-wrap">
                <img id="exp-logo" src="" alt="">
            </div>
            <div class="expanded-title-block">
                <div class="expanded-name" id="exp-name"></div>
                <div class="expanded-category" id="exp-category"></div>
            </div>
        </div>

        <hr class="divider">

        <p class="expanded-desc" id="exp-desc"></p>

        <div class="expanded-tags" id="exp-tags"></div>

        <div class="expanded-meta" id="exp-meta"></div>

        <div class="expanded-actions">
            <a class="btn-primary" id="exp-link" href="#" target="_blank" rel="noopener noreferrer">Open link ↗</a>
            <button class="btn-secondary" id="btn-copy">Copy link</button>
        </div>
    </div>
</div>

<!-- Tweaks Panel -->
<div class="tweaks-panel" id="tweaks-panel">
    <div class="tweaks-title">Tweaks</div>
    <div class="tweak-row">
        <div class="tweak-label">Expansion style</div>
        <div class="tweak-options">
            <button class="tweak-opt active" data-tweak="style" data-val="modal">Modal</button>
            <button class="tweak-opt" data-tweak="style" data-val="sheet">Sheet</button>
            <button class="tweak-opt" data-tweak="style" data-val="inline">Inline</button>
        </div>
    </div>
    <div class="tweak-row">
        <div class="tweak-label">Tags style</div>
        <div class="tweak-options">
            <button class="tweak-opt active" data-tweak="tags" data-val="soft">Soft</button>
            <button class="tweak-opt" data-tweak="tags" data-val="solid">Solid</button>
        </div>
    </div>
    <div class="tweak-row">
        <div class="tweak-label">Show meta</div>
        <div class="tweak-options">
            <button class="tweak-opt active" data-tweak="meta" data-val="on">On</button>
            <button class="tweak-opt" data-tweak="meta" data-val="off">Off</button>
        </div>
    </div>
</div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "style": "modal",
  "tags": "soft",
  "meta": "on"
}/*EDITMODE-END*/;
let tweaks = {...TWEAK_DEFAULTS};

const items = [
    { name: 'Vivaldi', image_path: 'vivaldi.svg', description: 'A highly customisable browser for power users. Offers tab stacking, built-in note-taking, a mail client, and deep privacy controls — all without the telemetry.', tags: ['browser', 'privacy'], link: 'https://vivaldi.com', category: 'Browser', added: 'Jan 2024' },
    { name: 'Ventoy', image_path: 'ventoy.svg', description: 'Open-source tool to create bootable USB drives. Just drag ISO files onto the drive — no flashing needed, multiple ISOs supported simultaneously.', tags: ['utility', 'bootable'], link: 'https://ventoy.net', category: 'Utility', added: 'Mar 2024' },
    { name: 'scrcpy', image_path: 'scrcpy.svg', description: 'Mirror and control your Android device from your desktop over USB or TCP/IP. No root required, minimal latency, free and open source.', tags: ['android', 'utility'], link: 'https://github.com/Genymobile/scrcpy', category: 'Utility', added: 'Feb 2024' },
    { name: 'Blobmaker', image_path: 'blobmaker.svg', description: 'A free generative design tool to quickly create random, unique SVG blob shapes. Great for backgrounds, illustrations, and UI accents.', tags: ['design', 'svg'], link: 'https://blobmaker.app', category: 'Design', added: 'Nov 2023' },
    { name: 'iHatePDF', image_path: 'ihatepdf.svg', description: 'A suite of online PDF tools — merge, split, compress, convert, and edit PDFs without installing anything. Free and fast.', tags: ['pdf', 'web tool'], link: 'https://ilovepdf.com', category: 'Web Tool', added: 'Dec 2023' },
    { name: 'Vert', image_path: 'vert.svg', description: 'Local, AI-powered image format converter. Converts between PNG, JPEG, WebP, AVIF and more — entirely in the browser with no upload required.', tags: ['image', 'converter'], link: 'https://vert.sh', category: 'Utility', added: 'Apr 2024' },
    { name: 'Chrome', image_path: 'chrome.svg', description: 'Google\'s fast and widely-used web browser with strong extension support, developer tools, and seamless Google account integration.', tags: ['browser'], link: 'https://google.com/chrome', category: 'Browser', added: 'Oct 2023' },
    { name: 'CrystalDisk', image_path: 'hdd.svg', description: 'Monitors your drives\' SMART data to give early warning of impending failure. Essential for diagnosing storage health on Windows.', tags: ['utility', 'hardware'], link: 'https://crystalmark.info', category: 'Utility', added: 'Jan 2024' },
];

let currentItem = null;
let expansionStyle = 'modal';

// --- Render grid ---
function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    items.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'card flex flex-col items-center gap-lg';
        card.innerHTML = `
            <h2 style="font-size:.95rem;font-weight:800;text-align:center;">${item.name}</h2>
            <img class="logo" src="assets/logos/${item.image_path}" alt="${item.name}" style="width:clamp(2rem,5dvw,4.5rem);height:auto;object-fit:contain;">
            <p style="font-size:.75rem;color:rgba(255,255,255,.5);text-align:center;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin:0 .5rem;">${item.description}</p>
            <div style="display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:auto;">
                ${item.tags.map(t => `<span style="background:#ef4444;color:#fff;padding:.2rem .4rem;border-radius:.15rem;font-size:.65rem;font-weight:600;">${t}</span>`).join('')}
            </div>
        `;
        card.addEventListener('click', () => openCard(item, card));
        grid.appendChild(card);
    });
}

// --- Open expanded card ---
function openCard(item, cardEl) {
    currentItem = item;

    // Animate source card
    cardEl.classList.add('opening');
    cardEl.addEventListener('animationend', () => cardEl.classList.remove('opening'), {once:true});

    // Populate
    document.getElementById('exp-logo').src = `assets/logos/${item.image_path}`;
    document.getElementById('exp-logo').alt = item.name;
    document.getElementById('exp-name').textContent = item.name;
    document.getElementById('exp-category').textContent = item.category;
    document.getElementById('exp-desc').textContent = item.description;
    document.getElementById('exp-link').href = item.link;

    // Tags
    const tagsEl = document.getElementById('exp-tags');
    const isSolid = tweaks.tags === 'solid';
    tagsEl.innerHTML = item.tags.map(t =>
        isSolid
            ? `<span style="background:#ef4444;color:#fff;padding:.3rem .6rem;border-radius:.15rem;font-size:.75rem;font-weight:600;">${t}</span>`
            : `<span style="background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.3);padding:.3rem .6rem;border-radius:.15rem;font-size:.75rem;font-weight:600;">${t}</span>`
    ).join('');

    // Meta
    const metaEl = document.getElementById('exp-meta');
    if (tweaks.meta === 'on') {
        metaEl.style.display = 'flex';
        metaEl.innerHTML = `
            <div style="display:flex;flex-direction:column;gap:.3rem;">
                <div style="font-size:.7rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em;">Category</div>
                <div style="font-size:.825rem;font-weight:600;">${item.category}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:.3rem;">
                <div style="font-size:.7rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em;">Added</div>
                <div style="font-size:.825rem;font-weight:600;">${item.added}</div>
            </div>
        `;
    } else {
        metaEl.style.display = 'none';
    }

    // Apply style variant
    applyExpansionStyle();

    // Open backdrop
    document.getElementById('backdrop').classList.add('open');
    document.body.style.overflow = 'hidden';

    // Reset copy button
    const copyBtn = document.getElementById('btn-copy');
    copyBtn.textContent = 'Copy link';
    copyBtn.classList.remove('copied');
}

function applyExpansionStyle() {
    const backdrop = document.getElementById('backdrop');
    const card = document.getElementById('expanded-card');
    const style = tweaks.style;

    // Reset
    backdrop.style.alignItems = 'center';
    backdrop.style.justifyContent = 'center';
    backdrop.style.padding = '1rem';
    card.style.width = '';
    card.style.maxHeight = '';
    card.style.borderRadius = '';
    card.style.bottom = '';
    card.style.position = '';
    card.style.transform = '';
    card.style.marginTop = '';

    if (style === 'sheet') {
        backdrop.style.alignItems = 'flex-end';
        backdrop.style.justifyContent = 'center';
        backdrop.style.padding = '0';
        card.style.width = 'min(600px,100%)';
        card.style.borderRadius = '1rem 1rem 0 0';
        card.style.maxHeight = '90dvh';
        card.style.overflowY = 'auto';
        card.style.transform = '';
    } else if (style === 'inline') {
        backdrop.style.alignItems = 'flex-start';
        backdrop.style.justifyContent = 'center';
        backdrop.style.padding = '5rem 1rem 1rem';
        card.style.width = 'min(480px,100%)';
        card.style.marginTop = '0';
    } else {
        // modal (default)
        card.style.width = 'min(520px,100%)';
    }
}

function closeCard() {
    document.getElementById('backdrop').classList.remove('open');
    document.body.style.overflow = '';
}

document.getElementById('btn-close').addEventListener('click', closeCard);
document.getElementById('backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('backdrop')) closeCard();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

// Copy link
document.getElementById('btn-copy').addEventListener('click', () => {
    if (!currentItem) return;
    navigator.clipboard.writeText(currentItem.link).catch(() => {});
    const btn = document.getElementById('btn-copy');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy link'; btn.classList.remove('copied'); }, 2000);
});

// Tweaks
window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('open');
    if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('open');
});
window.parent.postMessage({type: '__edit_mode_available'}, '*');

document.querySelectorAll('.tweak-opt').forEach(btn => {
    btn.addEventListener('click', () => {
        const key = btn.dataset.tweak;
        const val = btn.dataset.val;
        tweaks[key] = val;
        // update active state
        document.querySelectorAll(`.tweak-opt[data-tweak="${key}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.parent.postMessage({type: '__edit_mode_set_keys', edits: tweaks}, '*');
        // re-apply if card open
        if (document.getElementById('backdrop').classList.contains('open') && currentItem) {
            openCard(currentItem, document.querySelector('.card'));
        }
    });
});

renderGrid();
</script>
</body>
</html>
