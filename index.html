<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fel's collection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/main.js" defer></script>
    <script src="scripts/anim.js" type="module"></script>
    <script src="scripts/search.js" defer></script>
    <script src="scripts/auth.js" defer></script>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <header class="site-header">

        <div class="site-identity">
            <span id="site-title" class="fw-black">fel's collection</span>
            <small class="text-muted">made it out the bookmarks bar</small>
        </div>

        <div class="search-container">
            <input id="search" type="text" placeholder="search..." name="search" oninput="performSearch()" autocomplete="off">
            <div id="search-suggestions" class="search-suggestions" hidden></div>
        </div>

        <div class="header-right">
            <nav class="site-nav">
                <a href="add.html">add</a>
                <a href="guides.html">guides</a>
            </nav>

            <div class="auth-container">
                <button id="auth-trigger" class="btn-auth">log in</button>
                <div id="auth-popover" class="auth-popover">
                    <div id="auth-options">
                        <button id="google-auth" class="btn-provider">sign in with google</button>
                        <button id="github-auth" class="btn-provider">sign in with github</button>
                        <div class="why-no-signin">
                            <button class="why-toggle" id="why-toggle">why no traditional sign in?</button>
                            <p class="why-text" id="why-text">I don't feel like coming up with a whole authentication service, and having to store everyone's passwords for one little site. who doesn't have a Google account these days?</p>
                        </div>
                    </div>
                    <div id="auth-user" hidden>
                        <button id="sign-out-btn" class="btn-provider">sign out</button>
                    </div>
                </div>
            </div>
        </div>

    </header>

    <div class="filter-bar">
        <div class="category-filter">
            <button id="category-btn" class="btn-category">all categories</button>
            <div id="category-dropdown" class="category-dropdown"></div>
        </div>
        <div class="category-filter">
            <button id="sort-btn" class="btn-category">A → Z</button>
            <div id="sort-dropdown" class="category-dropdown">
                <button class="category-option active" data-sort="az">A → Z</button>
                <button class="category-option" data-sort="za">Z → A</button>
                <button class="category-option" data-sort="newest">newest first</button>
                <button class="category-option" data-sort="oldest">oldest first</button>
            </div>
        </div>
        <button id="reset-filters" class="btn-reset" title="Reset filters" aria-label="Reset filters">↺</button>
    </div>

    <section class="item-wrapper flex flex-wrap justify-center items-center gap-md">
        <!-- this is where the app listings shall go. generated by js. -->
    </section>

    <!-- Backdrop + Expanded Card -->
    <div class="backdrop" id="backdrop" role="dialog" aria-modal="true">
        <div class="expanded-card" id="expanded-card">
            <button class="btn-close" id="btn-close" aria-label="Close">✕</button>

            <div class="expanded-header">
                <div class="expanded-logo-wrap">
                    <img id="exp-logo" src="" alt="">
                </div>
                <div class="expanded-title-block">
                    <div class="expanded-name" id="exp-name"></div>
                    <div class="expanded-category" id="exp-category"></div>
                </div>
            </div>

            <hr class="divider">

            <p class="expanded-desc" id="exp-desc"></p>

            <div class="expanded-tags" id="exp-tags"></div>

            <div class="expanded-meta" id="exp-meta"></div>

            <div class="expanded-actions">
                <a class="btn-primary" id="exp-link" href="#" target="_blank" rel="noopener noreferrer">Open link ↗</a>
                <button class="btn-secondary" id="btn-copy">Copy link</button>
            </div>
        </div>
    </div>

    <!-- Tweaks Panel -->
    <div class="tweaks-panel" id="tweaks-panel">
        <div class="tweaks-title">Tweaks</div>
        <div class="tweak-row">
            <div class="tweak-label">Expansion style</div>
            <div class="tweak-options">
                <button class="tweak-opt active" data-tweak="style" data-val="modal">Modal</button>
                <button class="tweak-opt" data-tweak="style" data-val="sheet">Sheet</button>
                <button class="tweak-opt" data-tweak="style" data-val="inline">Inline</button>
            </div>
        </div>
        <div class="tweak-row">
            <div class="tweak-label">Tags style</div>
            <div class="tweak-options">
                <button class="tweak-opt active" data-tweak="tags" data-val="soft">Soft</button>
                <button class="tweak-opt" data-tweak="tags" data-val="solid">Solid</button>
            </div>
        </div>
        <div class="tweak-row">
            <div class="tweak-label">Show meta</div>
            <div class="tweak-options">
                <button class="tweak-opt active" data-tweak="meta" data-val="on">On</button>
                <button class="tweak-opt" data-tweak="meta" data-val="off">Off</button>
            </div>
        </div>
    </div>

    <script src="scripts/card.js" defer></script>
</body>

</html>
